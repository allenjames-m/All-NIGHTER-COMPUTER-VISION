<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floor plan 3D viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, Segoe UI, Arial, sans-serif; background: #f4f4f2; color: #222; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    .panel { position: fixed; top: 14px; left: 14px; background: rgba(255,255,255,.94); border-radius: 12px;
             padding: 12px 14px; box-shadow: 0 2px 12px rgba(0,0,0,.18); max-width: 300px; }
    .panel h1 { font-size: 15px; margin: 0 0 8px; }
    .toggle { display: flex; border: 1px solid #bbb; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    .toggle button { flex: 1; padding: 8px 10px; border: 0; background: #fff; cursor: pointer; font-size: 13px; }
    .toggle button.on { background: #222; color: #fff; }
    .legend { font-size: 13px; line-height: 1.7; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex: none; }
    .hint { font-size: 12px; color: #666; margin-top: 8px; }
    #legend { display: none; }
  </style>
</head>
<body>
  <model-viewer id="mv" src="model.glb" camera-controls auto-rotate shadow-intensity="1"
                exposure="1.1" alt="3D model of the floor plan"></model-viewer>
  <div class="panel">
    <h1>Floor plan in 3D</h1>
    <div class="toggle">
      <button id="bReal">Realistic</button>
      <button id="bConf" class="on">Confidence</button>
    </div>
    <div id="legend" class="legend" style="display:block">
      <div><span class="dot" style="background:#3cb44b"></span> Detected from the plan</div>
      <div><span class="dot" style="background:#f0c828"></span> Inferred / corrected from dimensions</div>
      <div><span class="dot" style="background:#dc3c3c"></span> Assumed default (e.g. floor, 2.7 m height)</div>
    </div>
    <div class="hint">Drag to rotate, scroll to zoom.</div>
  </div>
  <script>
    const mv = document.getElementById('mv');
    const bReal = document.getElementById('bReal'), bConf = document.getElementById('bConf');
    const legend = document.getElementById('legend');
    function show(mode) {
      const conf = mode === 'confidence';
      mv.src = conf ? 'model.glb' : 'model_realistic.glb';
      bConf.classList.toggle('on', conf);
      bReal.classList.toggle('on', !conf);
      legend.style.display = conf ? 'block' : 'none';
    }
    bConf.onclick = () => show('confidence');
    bReal.onclick = () => show('realistic');
  </script>
</body>
</html>
